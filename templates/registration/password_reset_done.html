{% extends 'base.html' %}

{% block title %}Email envoyé - Gestion des Écoles ASITECH{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Vérifiez votre email</h1>
        <p class="text-gray-600 mb-2">Si un compte existe pour cet email, vous recevrez un lien de réinitialisation.</p>
        <p class="text-gray-500 text-sm mb-6">Le lien expire dans quelques heures.</p>

        <a href="{% url 'accounts:login' %}" class="inline-block w-full py-3 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
            Retour à la connexion
        </a>
    </div>
</div>
{% endblock %}
