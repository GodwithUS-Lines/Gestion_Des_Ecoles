{% extends 'base.html' %}

{% block title %}Mot de passe réinitialisé - Gestion des Écoles ASITECH{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Mot de passe réinitialisé</h1>
        <p class="text-gray-600 mb-6">Votre mot de passe a été défini avec succès. Vous pouvez maintenant vous connecter.</p>

        <a href="{% url 'accounts:login' %}" class="inline-block w-full py-3 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
