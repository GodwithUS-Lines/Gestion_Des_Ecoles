{% extends "module_base.html" %}
{% block module_content %}
<div class="max-w-xl bg-white rounded-xl shadow p-6">
    <h1 class="text-xl font-bold mb-4">{{ page_title }}</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="text-sm text-red-600 mt-1">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <div class="flex gap-3 pt-2">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Enregistrer</button>
            <a href="{{ cancel_url }}" class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
